server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

  # OBS panel live events (Server-Sent Events): no buffering, long-lived.
  location ^~ /api/panel/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    # nginx hides X-Accel-* from the client by default; pass it on so CapRover's own nginx in front does not buffer the stream either.
    proxy_pass_header X-Accel-Buffering;
    proxy_connect_timeout 2s;
    proxy_read_timeout 1h;
    # 128k: the PC app sends the album cover with the song.
    client_max_body_size 128k;
  }

  # TikTok LIVE chat relay (Server-Sent Events): no buffering, long-lived.
  location ^~ /api/tiktok/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    # nginx hides X-Accel-* from the client by default; pass it on so CapRover's own nginx in front does not buffer the stream either.
    proxy_pass_header X-Accel-Buffering;
    proxy_connect_timeout 2s;
    proxy_read_timeout 1h;
  }

  # Twitch EventSub and Kick webhooks: bigger bodies than the rest of /api.
  location ~ ^/api/(eventsub|webhooks)/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    client_max_body_size 64k;
  }

  # Live counter and follower counts (deploy/stats-server.mjs). The forwarded-for list from CapRover is passed on as it came.
  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    client_max_body_size 1k;
  }

  # OBS sources: plain app shell, never the pre-rendered article.
  location /o/ {
    add_header Cache-Control "no-cache";
    try_files /app.html =404;
  }

  # Pre-rendered pages live at /<page>/index.html; no trailing-slash redirect, canonical has none.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /index.html;
  }

  location = /llms.txt { default_type text/plain; charset utf-8; }
  # One-command install: irm https://overlays.vxh.pl/install.ps1 | iex (must be text, UTF-8, never cached long).
  location = /install.ps1 { default_type text/plain; charset utf-8; add_header Cache-Control "no-cache"; }
}
