# Builds the Windows tray app "VXH Overlays Tool" (tools/overlays-tool, Rust) as one small .exe.
# Every push that touches the app tests it and uploads an (unsigned) build artifact. Releases are NOT made here:
# they must carry the EV signature (hardware certificate on the maintainer's PC), see tools/overlays-tool/release.ps1.
name: VXH Overlays Tool
on:
  push:
    paths: ['tools/overlays-tool/**', '.github/workflows/overlays-tool.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/overlays-tool
      - name: Test
        working-directory: tools/overlays-tool
        run: cargo test --release
      - name: Build
        working-directory: tools/overlays-tool
        run: |
          cargo build --release
          Copy-Item "target/release/vxh-overlays-tool.exe" "VXH Overlays Tool.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: VXH-Overlays-Tool
          path: tools/overlays-tool/VXH Overlays Tool.exe
