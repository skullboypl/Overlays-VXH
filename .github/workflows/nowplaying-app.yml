# Builds the Windows tray app "VXH Now Playing" (tools/nowplaying-app) as one .exe that needs no .NET install.
# Every push that touches the app uploads it as a build artifact; a tag "nowplaying-v*" also attaches it to a release.
name: VXH Now Playing app
on:
  push:
    paths: ['tools/nowplaying-app/**', '.github/workflows/nowplaying-app.yml']
    tags: ['nowplaying-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        working-directory: tools/nowplaying-app
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: VXH-Now-Playing
          path: tools/nowplaying-app/out/VXH Now Playing.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/nowplaying-v')
        uses: softprops/action-gh-release@v2
        with:
          files: tools/nowplaying-app/out/VXH Now Playing.exe
