[package]
name = "vxh-overlays-tool"
version = "2.0.1"
edition = "2021"
description = "VXH Overlays Tool: tray app for the VXH Overlays OBS panel (now playing, chat commands, TikTok LIVE)"
license = "MIT"
publish = false

[[bin]]
name = "vxh-overlays-tool"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.31"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "native-tls"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
flate2 = "1"
url = "2"
rand = "0.8"
regex = "1"
arboard = { version = "3", default-features = false }
dirs = "6"
open = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico"] }
base64 = "0.22"
log = "0.4"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.20"
winreg = "0.55"
windows = { version = "0.61", features = [
  "Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Graphics_Imaging",
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_System_WinRT",
] }
raw-window-handle = "0.6"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
